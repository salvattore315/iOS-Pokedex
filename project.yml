name: Pokedex
options:
  bundleIdPrefix: com.salvadormartinez
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupOrdering:
    - order: [Pokedex, PokedexTests, PokedexUITests, Packages]
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  Networking:
    path: Packages/Networking
  DesignSystem:
    path: Packages/DesignSystem
targets:
  Pokedex:
    type: application
    platform: iOS
    sources: [Pokedex]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salvadormartinez.pokedex
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Networking
      - package: DesignSystem
  PokedexTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PokedexTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.salvadormartinez.pokedex.tests
    dependencies:
      - target: Pokedex
  PokedexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PokedexUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.salvadormartinez.pokedex.uitests
        TEST_TARGET_NAME: Pokedex
    dependencies:
      - target: Pokedex
  PokedexCatalog:
    type: application
    platform: iOS
    sources: [Catalog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salvadormartinez.pokedex.catalog
        INFOPLIST_KEY_CFBundleDisplayName: DS Catalog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: DesignSystem
schemes:
  Pokedex:
    build:
      targets:
        Pokedex: all
    test:
      targets:
        - PokedexTests
        - PokedexUITests
  PokedexCatalog:
    build:
      targets:
        PokedexCatalog: all
    run:
      config: Debug
